name: release

# Publishes to npm, with provenance, when a version tag is pushed (`git tag v0.1.0 && git push origin v0.1.0`).
# Needs the repository secret NPM_TOKEN (an npm automation / granular token that can publish `neon-activity-graph`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # (npm provenance)

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # (pnpm applies `publishConfig.exports`, which points the package at dist)
      - run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
