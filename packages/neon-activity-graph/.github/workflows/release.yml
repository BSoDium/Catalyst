name: release

# Publishes to npm with provenance when a version tag is pushed (`git tag v0.1.1 && git push origin v0.1.1`), through npm Trusted Publishing (OIDC): there is no token and no secret.
# One-time setup on npmjs.com (package > Settings > Trusted Publisher > GitHub Actions): user BSoDium, repository Neon-activity-graph, workflow release.yml, environment empty. See the README.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # (the OIDC token npm exchanges for a publish credential, and the provenance)

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # (Trusted Publishing needs npm 11.5.1 or newer; npm 12 needs a newer node than 22.14, so the major is pinned)
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # (a tag for a version that is already on npm, the first one having been published by hand, is a no-op)
      - name: Already published?
        id: exists
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "neon-activity-graph@$v" version >/dev/null 2>&1; then echo "published=true" >> "$GITHUB_OUTPUT"; echo "neon-activity-graph@$v is already on npm: nothing to do"; fi
      # (`prepublishOnly` builds; `prepack` points `exports` at dist for the tarball, see scripts/apply-publish-config.mjs)
      - if: steps.exists.outputs.published != 'true'
        run: npm publish --provenance --access public
