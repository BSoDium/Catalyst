<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon-activity-graph</title>
    <meta name="description" content="A 3D glass-and-neon activity graph in three.js: GitHub contributions over coding time, one column a day." />
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #15151a; --green: #0a8f2c; --blue: #1a73e8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0e; --fg: #ececf1; --green: #3ddc6a; --blue: #5aa9ff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; display: grid; align-content: center; }
      main { width: min(1400px, 100%); margin: 0 auto; padding: 24px 24px 40px; }
      h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); font-weight: 600; letter-spacing: -0.01em; }
      .sub { margin: 4px 0 0; opacity: 0.6; font-size: 14px; }
      .legend { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 16px; font-size: 14px; }
      .legend span { display: inline-flex; align-items: center; gap: 8px; }
      .legend i { width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
      .legend .g { color: var(--green); } .legend .b { color: var(--blue); } .legend b { color: var(--fg); font-weight: 500; }
      #graph { position: relative; width: 100%; aspect-ratio: 3.97 / 1; margin-top: 8px; }
      @media (max-width: 767px) { #graph { aspect-ratio: 0.8; } main { padding: 16px 12px 32px; } }
      #card { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.35; white-space: nowrap; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(12px); box-shadow: 0 6px 28px #0003; opacity: 0; transition: opacity 0.15s; }
      #card .d { opacity: 0.6; font-size: 12px; }
      #card .g { color: var(--green); } #card .b { color: var(--blue); }
      .foot { margin-top: 12px; font-size: 13px; opacity: 0.55; }
      .foot a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Neon-activity-graph</h1>
      <p class="sub" id="sub">One glass block a day, GitHub contributions over coding time.</p>
      <div class="legend"><span class="g"><i></i><b>GitHub contributions</b> above</span><span class="b"><i></i><b>WakaTime coding time</b> below</span></div>
      <div id="graph"><div id="card"></div></div>
      <p class="foot"><a href="https://github.com/BSoDium/Neon-activity-graph">Source, install and options on GitHub</a> · hover a day, click to cycle through the days behind it</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
