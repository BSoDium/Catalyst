# Catalyst fallback tile server: serves ONE static PMTiles archive, read-only.
# Runs as the unprivileged nginx user with a read-only root filesystem; everything nginx
# writes (pid, temp paths, generated CORS includes) lives in /tmp (a tmpfs).

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  default_type application/octet-stream;
  server_tokens off;

  # --- never compress: PMTiles tiles are already gzip/brotli/zstd and ranges must map 1:1 to bytes
  gzip off;

  # --- temp paths on the tmpfs (the proxy/fastcgi/uwsgi/scgi ones are unused but nginx insists on a path)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # --- file serving
  sendfile on;
  sendfile_max_chunk 1m;   # one big range cannot monopolise a worker
  tcp_nopush on;
  tcp_nodelay on;

  # --- request size / time limits (GET/HEAD/OPTIONS only, so bodies are never needed)
  client_max_body_size 1k;
  client_header_buffer_size 1k;
  large_client_header_buffers 2 4k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;
  keepalive_requests 200;
  reset_timedout_connection on;

  # --- behind Caddy/Traefik/another proxy every request comes from a private address;
  # trust X-Forwarded-For from private ranges only so the rate limits apply per real client.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fd00::/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # A MapLibre + PMTiles street session is roughly 70 requests in a burst.
  limit_req_zone  $binary_remote_addr zone=tiles_req:5m rate=40r/s;
  limit_conn_zone $binary_remote_addr zone=tiles_conn:5m;
  limit_req_status 429;
  limit_conn_status 429;

  # --- minimal access log: no UA, no referer, nothing personal beyond the client address.
  # The container's own healthcheck (127.0.0.1) is not logged.
  map $remote_addr $log_it {
    127.0.0.1 0;
    default   1;
  }
  log_format minimal '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout minimal if=$log_it;

  # nginx adds "Accept-Ranges: bytes" itself on plain 200s but not on 206/416 responses, and
  # add_header runs before the range filter, so $status cannot tell them apart. Key on the request
  # instead: any request with a Range header gets the header explicitly (in the rare case nginx
  # answers such a request with a plain 200 the value is simply repeated, which is harmless).
  map $http_range $accept_ranges {
    ""      "";
    default "bytes";
  }

  # Generated by docker-entrypoint.sh from CORS_ALLOW_ORIGINS:
  #   cors-map.conf      defines $cors_origin ("*" or the matching allowed Origin, empty otherwise)
  #   cors-headers.conf  the Access-Control-* headers for the tile file
  include /tmp/cors-map.conf;

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # THE only exposed resource. Exact match: no sibling file, no directory, no index and no
    # directory listing can ever be reached, even if more files sit in the mounted directory.
    location = /places.pmtiles {
      root /data;
      limit_req zone=tiles_req burst=120 nodelay;
      limit_conn tiles_conn 30;

      # Only GET, HEAD and OPTIONS exist here.
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        add_header Allow "GET, HEAD, OPTIONS" always;
        return 405;
      }

      # CORS preflight: no disk access.
      if ($request_method = OPTIONS) {
        include /tmp/cors-headers.conf;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match, If-Range" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }

      include /tmp/cors-headers.conf;
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Last-Modified" always;
      add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
      add_header Accept-Ranges $accept_ranges always;
      add_header X-Content-Type-Options nosniff always;
      add_header Cross-Origin-Resource-Policy cross-origin always;

      etag on;                   # strong validator; the PMTiles client uses it to detect a replaced file
      max_ranges 1;              # PMTiles only issues single-range requests; refuse multipart/byteranges abuse
      # 206/416 handling comes from nginx's range filter (static files).
    }

    # Everything else, including "/", "/places.pmtiles/", "/x.pmtiles", "/.env": 404.
    location / {
      access_log off;
      return 404;
    }
  }
}
