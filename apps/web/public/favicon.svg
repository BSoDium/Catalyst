<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- The navbar's Orbit glyph (lucide, ISC): ink follows the colour scheme, the two satellites are the signal cyan. -->
  <style>
    .ink { stroke: #0a0a0a; }
    .sat { stroke: #00698c; fill: #00698c; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #f5f5f5; } .sat { stroke: #38d4f5; fill: #38d4f5; } }
  </style>
  <path class="ink" d="M20.341 6.484A10 10 0 0 1 10.266 21.85"/>
  <path class="ink" d="M3.659 17.516A10 10 0 0 1 13.74 2.152"/>
  <circle class="ink" cx="12" cy="12" r="3"/>
  <circle class="sat" cx="19" cy="5" r="2"/>
  <circle class="sat" cx="5" cy="19" r="2"/>
</svg>
