<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img">
  <title>Abstract diagonal grid (demo article figure)</title>
  <style>
    .bg { fill: #ececec; }
    .l { stroke: #0a0a0a; stroke-width: 1; opacity: 0.18; }
    .s { stroke: #0a0a0a; stroke-width: 2; opacity: 0.85; fill: none; }
    .f { fill: #0a0a0a; opacity: 0.85; }
    .h { fill: #0a0a0a; opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151515; }
      .l { stroke: #f5f5f5; opacity: 0.16; }
      .s { stroke: #f5f5f5; }
      .f { fill: #f5f5f5; }
      .h { fill: #f5f5f5; opacity: 0.12; }
    }
  </style>
  <rect class="bg" width="960" height="600"/>
  <g class="l">
    <path d="M0 0L960 600M0 100L860 600M0 200L760 600M100 0L960 500M200 0L960 400M300 0L960 300"/>
  </g>
  <g class="s">
    <rect x="320" y="180" width="320" height="240"/>
  </g>
  <circle class="f" cx="320" cy="180" r="6"/>
  <circle class="f" cx="640" cy="420" r="6"/>
</svg>
