<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img">
  <title>Abstract short lines in stanzas (demo poem cover)</title>
  <style>
    .bg { fill: #ececec; }
    .l { stroke: #0a0a0a; stroke-width: 1; opacity: 0.18; }
    .s { stroke: #0a0a0a; stroke-width: 2; opacity: 0.85; fill: none; }
    .f { fill: #0a0a0a; opacity: 0.85; }
    .h { fill: #0a0a0a; opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151515; }
      .l { stroke: #f5f5f5; opacity: 0.16; }
      .s { stroke: #f5f5f5; }
      .f { fill: #f5f5f5; }
      .h { fill: #f5f5f5; opacity: 0.12; }
    }
  </style>
  <rect class="bg" width="960" height="600"/>
  <g class="s">
    <path d="M300 130H620M300 180H540M300 230H600"/>
    <path d="M300 330H580M300 380H480M300 430H620M300 480H520"/>
  </g>
  <circle class="f" cx="300" cy="130" r="5"/>
  <circle class="f" cx="300" cy="330" r="5"/>
</svg>
