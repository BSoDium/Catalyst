<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Default share image (1200x630). Hand-written around a picture of the app's own globe; `node scripts/brand/build.mjs` renders it to public/og-default.png.
       The picture (og-planet.png, made by scripts/brand/og-planet.mjs from the running app: the planet at night over Europe and Africa, the sun and its lens
       flare behind the limb) is embedded by build.mjs where the href of the image below is the placeholder. The text keeps the language of docs/design-system.md: near-black page,
       big type at 200 against 800 (Bricolage Grotesque, embedded by build.mjs). The words are the site's identity (app/lib/site.ts, SITE):
       lib/identity.test.ts keeps them equal. -->
  <defs>
    <linearGradient id="scrim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#0a0a0a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <image href="__OG_PLANET__" x="0" y="0" width="1200" height="630" image-rendering="pixelated"/>
  <!-- A scrim under the words, so they read over the stars and the planet's dark limb. -->
  <rect width="640" height="630" fill="url(#scrim)"/>

  <!-- Text: the name, the given name at 800 over the family name at 200, then who. -->
  <g font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#f5f5f5" letter-spacing="-3">
    <text x="74" y="230" font-size="104" font-weight="800">Elliot</text>
    <text x="74" y="332" font-size="104" font-weight="200">Négrel-Jerzy</text>
  </g>
  <g font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="300" fill="#a3a3a3">
    <text x="80" y="418">Design engineer</text>
    <text x="80" y="458">based in Warsaw</text>
  </g>
  <path d="M80 500H300" stroke="#f5f5f5" stroke-opacity="0.34" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2.4" fill="#a3a3a3">
    <text x="80" y="554">SOFTWARE / ARTICLES / ARTWORKS / POETRY</text>
  </g>
</svg>
