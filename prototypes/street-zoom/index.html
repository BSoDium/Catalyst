<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Street zoom spike</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage">
      <div id="map"></div>
      <div id="labels"><svg id="leaders" width="100%" height="100%"></svg></div>
    </div>
    <div id="panel">
      <details open>
        <summary>Street zoom spike</summary>
        <div class="row" id="views"></div>
        <div class="row" id="places"></div>
        <div class="row">
          <label>sharp reveal <input id="reveal" type="checkbox" /></label>
          <label>all sharp <input id="sharpall" type="range" min="0" max="1" step="0.01" value="0" /></label>
        </div>
        <div class="row" id="opts"></div>
      </details>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="attribution"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
